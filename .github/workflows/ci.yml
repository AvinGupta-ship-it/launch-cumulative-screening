name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Lint
        run: |
          uv run ruff check src tests scripts figures
          uv run ruff format --check src tests scripts figures
      - name: Type check
        run: uv run mypy --strict src
      - name: Fetch inputs
        run: uv run python scripts/fetch_data.py
      - name: Build processed layers
        run: |
          uv run python -c "from launchcum.data import gis; gis.build(pad_lon=-97.15456, pad_lat=25.99630, half_width_km=30.0)"
          uv run python -m launchcum.data.digitize > /dev/null
      - name: Tests
        run: uv run pytest -q
      - name: Quick pipeline
        run: uv run python -m launchcum.pipeline run --config configs/quick.yaml
      - name: Reference check
        run: uv run python scripts/check_refs.py paper/references.bib

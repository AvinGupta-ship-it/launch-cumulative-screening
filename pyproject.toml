[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "launchcum"
version = "1.0.1"
description = "Stochastic-scheduling framework for cumulative-effects screening of high-cadence launch and landing operations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Avin Gupta", email = "iamavingupta@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "xarray>=2024.6",
  "netCDF4>=1.7",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "SALib>=1.5",
  "matplotlib>=3.9",
  "cartopy>=0.23",
  "pydantic>=2.7",
  "pint>=0.24",
  "holidays>=0.50",
  "PyYAML>=6.0",
  "requests>=2.32",
  "pypdf>=4.2",
  "pymupdf>=2.1",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
launchcum = "launchcum.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/launchcum"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "figures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"scripts/literature_search.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
